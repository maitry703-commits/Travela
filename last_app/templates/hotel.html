{% extends 'index.html' %}
{% load static %}
{% block content %}

<!-- Header Start -->
<div class="container-fluid bg-breadcrumb">
    <div class="container text-center py-5" style="max-width: 900px;">
        <h3 class="text-white display-3 mb-4">Our Luxury Hotels</h3>
        <p class="text-white fs-5">Find the best hotels for your perfect vacation</p>
    </div>
</div>
<!-- Header End -->


<!-- Hotel Section Start -->
<div class="container py-5">
    <div class="row g-4">

        {% for hotel in hotels %}
        <div class="col-lg-4 col-md-6">
            <div class="card shadow rounded overflow-hidden border-0">
                
                <img src="{{ hotel.image.url }}" class="img-fluid" style="height:250px; object-fit:cover;">

                <div class="card-body text-center">
                    <h4 class="text-primary">{{ hotel.name }}</h4>
                    <p class="mb-2">
                        <i class="fa fa-map-marker-alt text-danger"></i>
                        {{ hotel.location }}
                    </p>

                    <p class="text-warning">
                        ★ ★ ★ ★ ★
                    </p>

                    <h5 class="text-success">₹ {{ hotel.price_per_night }} / night</h5>

                    <a href="{% url 'hotel_book' hotel.id %}" class="btn btn-primary mt-3 px-4">Book Now</a>
                </div>

            </div>
        </div>
        {% endfor %}

    </div>
</div>
<!-- Hotel Section End -->

{% endblock %}
