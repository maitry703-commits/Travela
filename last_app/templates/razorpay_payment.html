{% extends "index.html" %}
{% block content %}

<br><br><br>

<div class="container text-center">
    <div class="card shadow-lg p-5" style="max-width:600px; margin:auto;">

        <h2 style="color:#0072ff;">💳 Secure Payment</h2>
        <p>Please click the button below to complete your booking payment.</p>

        <hr>

        <h4>Total Amount: ₹{{ amount|floatformat:2 }}</h4>

        <button id="rzp-button1" class="btn btn-primary mt-3">
            Pay Now
        </button>

    </div>
</div>

<!-- Razorpay Script -->
<script src="https://checkout.razorpay.com/v1/checkout.js"></script>

<script>
var options = {
    "key": "{{ key }}",
    "amount": "{{ amount }}",
    "currency": "INR",
    "name": "Travela",
    "description": "Hotel Booking Payment",
    "order_id": "{{ payment.id }}",

    handler: function (response) {
    alert("Payment Successful");
    window.location.href = "/payment_success/{{ type }}/{{ booking.id }}/";
    },

    "theme": {
        "color": "#0072ff"
    }
};

var rzp1 = new Razorpay(options);

document.getElementById('rzp-button1').onclick = function(e){
    rzp1.open();
    e.preventDefault();
}
</script>

{% endblock %}
