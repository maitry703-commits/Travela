{% extends 'index.html' %}
{% load static %}
{% block content %}
<br>
<br>
<br>
<br>
<br>
<br>
<style>

/* Background on full page */
body{
    background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("https://images.unsplash.com/photo-1469854523086-cc02fe5d8800");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* Center container */
.auth-wrapper{
    min-height: calc(100vh - 90px);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass box */
.auth-box{
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 35px;
    width: 450px;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    color: white;
}

.auth-box h3{
    text-align: center;
    color: #00c6ff;
    margin-bottom: 25px;
}

/* Inputs */
.form-group{
    margin-bottom: 20px;
}

.form-group input,
.form-group textarea{
    width: 100%;
    padding: 10px;
    background: transparent;
    border: none;
    border-bottom: 2px solid #aaa;
    outline: none;
    color: white;
}

.form-group label{
    color: #ccc;
    font-size: 14px;
}

.readonly{
    color: #00c6ff;
    border-bottom: 2px solid #00c6ff;
}

/* Button */
.btn-book{
    width: 100%;
    padding: 12px;
    background: linear-gradient(45deg,#00c6ff,#0072ff);
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn-book:hover{
    transform: scale(1.03);
}

</style>

<div class="auth-wrapper">

<div class="auth-box">

<h3>🌍 Tour Package Booking</h3>

<form method="POST" action="{% url 'package_confirm' %}">
{% csrf_token %}
<input type="hidden" name="package_id" value="{{ package.id }}">
<!-- Package Details -->
<div class="form-group">
<label>Package Name</label>
<input type="text" name="package_name" value="{{ package.title }}" readonly class="readonly">
</div>

<div class="form-group">
<label>Destination</label>
<input type="text" name="destination" value="{{ package.destination }}" readonly class="readonly">
</div>


<div class="form-group">
<label>Price Per Person</label>
<input type="text" name="price" value="{{ package.price }}" readonly class="readonly">
</div>

<hr style="border-color: rgba(255,255,255,0.3);">

    <input type="hidden" name="package" value="{{ package.price }}">

<!-- Customer Details -->
<div class="form-group">
<label>Full Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Phone</label>
<input type="text" name="phone" required>
</div>

<div class="form-group">
<label>Travel Date</label>
<input type="date" name="travel_date" required>
</div>

<div class="form-group">
<label>Number of Persons</label>
<input type="number" name="persons" min="1" required>
</div>

<div class="form-group">
<label>Special Request</label>
<textarea name="request" rows="3"></textarea>
</div>

<button type="submit" class="btn-book">
Pay & Confirm Booking
</button>
</form>

</div>
</div>

{% endblock %}
