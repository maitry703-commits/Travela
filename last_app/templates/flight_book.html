{% extends 'index.html' %}
{% load static %}
{% block content %}

<br><br><br><br><br><br>

<style>

/* Background */
body{
    background: linear-gradient(rgba(0,0,0,0.65), rgba(0,0,0,0.65)),
    url("https://images.unsplash.com/photo-1504196606672-aef5c9cefc92");
    background-size: cover;
    background-position: center;
    background-attachment: fixed;
}

/* Center Wrapper */
.auth-wrapper{
    min-height: calc(100vh - 90px);
    display: flex;
    justify-content: center;
    align-items: center;
}

/* Glass Box */
.auth-box{
    background: rgba(255,255,255,0.12);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 35px;
    width: 480px;
    border-radius: 15px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.6);
    color: white;
}

.auth-box h3{
    text-align: center;
    color: #00c6ff;
    margin-bottom: 25px;
}

/* Form Styling */
.form-group{
    margin-bottom: 20px;
}

.form-group input,
.form-group textarea{
    width: 100%;
    padding: 10px;
    background: transparent;
    border: none;
    border-bottom: 2px solid #aaa;
    outline: none;
    color: white;
}

.form-group label{
    color: #ccc;
    font-size: 14px;
}

/* Readonly Flight Details */
.readonly{
    color: #00c6ff;
    border-bottom: 2px solid #00c6ff;
}

/* Button */
.btn-book{
    width: 100%;
    padding: 12px;
    background: linear-gradient(45deg,#00c6ff,#0072ff);
    border: none;
    border-radius: 6px;
    color: white;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s;
}

.btn-book:hover{
    transform: scale(1.03);
}

</style>

<div class="auth-wrapper">
<div class="auth-box">

<h3>✈️ Flight Booking</h3>

<form method="POST" action="{% url 'flight_confirm' %}">
{% csrf_token %}

<!-- Flight Details -->
 <input type="hidden" name="flight_id" value="{{ flight.id }}"> 
<div class="form-group">
<label>Airline</label>
<input type="text" name="airline" value="{{ flight.airline_name }}" readonly class="readonly">
</div>

<div class="form-group">
<label>Route</label>
<div class="info-row"><b>Route:</b> {{ flight.from_location }} → {{ flight.to_location }}</div></div>

<input type="hidden" name="from_location" value="{{ flight.from_location }}">
<input type="hidden" name="to_location" value="{{ flight.to_location }}">

<div class="form-group">
<label>Departure Time</label>
<input type="hidden" name="departure_time" value="{{ flight.departure_time }}" readonly class="readonly">
<input type="text" value="{{ flight.departure_time|time:'g:i A' }}" readonly class="readonly">
</div>

<div class="form-group">
<label>Price Per Person</label>
<input type="hidden" name="price" value="{{ flight.price }}">

<input type="text" value="₹ {{ flight.price }}" readonly class="readonly">
</div>

<hr style="border-color: rgba(255,255,255,0.3);">

<!-- Passenger Details -->
<div class="form-group">
<label>Full Name</label>
<input type="text" name="name" required>
</div>

<div class="form-group">
<label>Email</label>
<input type="email" name="email" required>
</div>

<div class="form-group">
<label>Phone</label>
<input type="text" name="phone" required>
</div>

<div class="form-group">
<label>Travel Date</label>
<input type="date" name="travel_date" required>
</div>

<div class="form-group">
<label>Number of Passengers</label>
<input type="number" name="passengers" min="1" value="1" required>
</div>

<div class="form-group">
<label>Special Request</label>
<textarea name="request" rows="3"></textarea>
</div>

<button type="submit" class="btn-book">
Pay & Confirm Booking
</button>

</form>
</div>
</div>

{% endblock %}
